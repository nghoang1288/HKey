name: windows
on:
  push:
    branches: [windows, main]
    tags: ['v*']
    paths: [Engine/**, Tools/autoswitch/**, Windows/**, .github/workflows/windows.yml]
  pull_request:
    paths: [Engine/**, Tools/autoswitch/**, Windows/**, .github/workflows/windows.yml]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing GitHub release tag to package for and upload to (e.g. v1.0.25)"
        required: false
jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ninja
        run: choco install ninja -y --no-progress
        shell: pwsh
      - name: Engine lock (rule cases, golden, Telex lock, driver parity, perf)
        run: pwsh Windows/check.ps1
        shell: pwsh
      - name: Build app (version from project.yml)
        if: hashFiles('Windows/App/CMakeLists.txt') != ''
        run: |
          $ver = (Select-String -Path project.yml -Pattern 'MARKETING_VERSION: "([^"]+)"').Matches[0].Groups[1].Value
          "HKEY_VERSION=$ver" >> $env:GITHUB_ENV
          "VIKEY_VERSION=$ver" >> $env:GITHUB_ENV
          cmake -S Windows -B Windows/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build Windows/build --config Release --target hkey
        shell: pwsh
      - uses: actions/upload-artifact@v4
        if: hashFiles('Windows/App/CMakeLists.txt') != ''
        with:
          name: HKey-windows-${{ matrix.arch }}
          path: Windows/build/App/HKey.exe

  # Tag v<version>: installers + portable zips onto the GitHub release.
  package:
    needs: engine
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Installers (Inno Setup) + portable zips
        run: |
          $ver = (Select-String -Path project.yml -Pattern 'MARKETING_VERSION: "([^"]+)"').Matches[0].Groups[1].Value
          "$ver" | Out-Host
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($arch in @('x64', 'arm64')) {
            $src = "artifacts/HKey-windows-$arch"
            if (Test-Path "$src/HKey.exe") {
              & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DVersion=$ver" "/DArch=$arch" "/DSrc=$((Resolve-Path $src).Path)" Windows/installer/HKey.iss
              if ($LASTEXITCODE -eq 0) {
                Move-Item "Windows/installer/out/HKey-$ver-$arch-Setup.exe" dist/ -Force
              }
              Compress-Archive -Path "$src/HKey.exe" -DestinationPath "dist/HKey-$ver-$arch-portable.zip" -Force
            }
          }
          Get-ChildItem dist | Out-Host
        shell: pwsh
      - name: Upload to GitHub Release
        run: gh release upload "${{ inputs.release_tag || github.ref_name }}" dist/* --clobber -R ${{ github.repository }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
