name: windows
on:
  push:
    branches: [windows, main]
    tags: ['v*']
    paths: [Engine/**, Tools/autoswitch/**, Windows/**, .github/workflows/windows.yml, project.yml]
  pull_request:
    paths: [Engine/**, Tools/autoswitch/**, Windows/**, .github/workflows/windows.yml, project.yml]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing or new GitHub release tag to package for and upload to (e.g. v1.0.26)"
        required: false
jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ninja
        run: choco install ninja -y --no-progress
        shell: pwsh
      - name: Engine lock (rule cases, golden, Telex lock, driver parity, perf)
        run: pwsh Windows/check.ps1
        shell: pwsh
      - name: Build app (version from project.yml)
        if: hashFiles('Windows/App/CMakeLists.txt') != ''
        run: |
          $ver = (Select-String -Path project.yml -Pattern 'MARKETING_VERSION: "([^"]+)"').Matches[0].Groups[1].Value
          "HKEY_VERSION=$ver" >> $env:GITHUB_ENV
          "VIKEY_VERSION=$ver" >> $env:GITHUB_ENV
          cmake -S Windows -B Windows/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build Windows/build --config Release --target hkey
        shell: pwsh
      - uses: actions/upload-artifact@v4
        if: hashFiles('Windows/App/CMakeLists.txt') != ''
        with:
          name: HKey-windows-${{ matrix.arch }}
          path: Windows/build/App/HKey.exe

  # Automatically creates and publishes GitHub Release v<version> when MARKETING_VERSION changes on main,
  # or when a v* tag / workflow_dispatch is triggered.
  package:
    needs: engine
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Determine release tag
        id: rel
        shell: pwsh
        run: |
          $ver = (Select-String -Path project.yml -Pattern 'MARKETING_VERSION: "([^"]+)"').Matches[0].Groups[1].Value
          $tag = if ("${{ inputs.release_tag }}" -ne "") {
            "${{ inputs.release_tag }}"
          } elseif ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            "${{ github.ref_name }}"
          } else {
            "v$ver"
          }
          "ver=$ver" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

          $shouldRun = $true
          if ("${{ github.ref }}" -eq "refs/heads/main" -and "${{ inputs.release_tag }}" -eq "") {
            $ErrorActionPreference = 'Continue'
            $PSNativeCommandUseErrorActionPreference = $false
            gh release view "$tag" -R "${{ github.repository }}" 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) { $shouldRun = $false }
            git ls-remote --exit-code --tags origin "refs/tags/$tag" 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) { $shouldRun = $false }
            $global:LASTEXITCODE = 0
            $ErrorActionPreference = 'Stop'
          }
          "publish=$($shouldRun.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          exit 0
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: steps.rel.outputs.publish == 'true'
        with:
          path: artifacts
      - name: Installers (Inno Setup), portable zips, standalone binaries & SHA256SUMS
        if: steps.rel.outputs.publish == 'true'
        shell: pwsh
        run: |
          $ver = "${{ steps.rel.outputs.ver }}"
          "$ver" | Out-Host
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($arch in @('x64', 'arm64')) {
            $src = "artifacts/HKey-windows-$arch"
            if (Test-Path "$src/HKey.exe") {
              & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DVersion=$ver" "/DArch=$arch" "/DSrc=$((Resolve-Path $src).Path)" Windows/installer/HKey.iss
              if ($LASTEXITCODE -ne 0) {
                throw "Inno Setup compilation failed for $arch with exit code $LASTEXITCODE"
              }
              Move-Item "Windows/installer/out/HKey-$ver-$arch-Setup.exe" dist/ -Force
              Compress-Archive -Path "$src/HKey.exe" -DestinationPath "dist/HKey-$ver-$arch-portable.zip" -Force
              Copy-Item "$src/HKey.exe" -Destination "dist/HKey-$ver-$arch.exe" -Force
            }
          }
          if (Test-Path "artifacts/HKey-windows-x64/HKey.exe") {
            Copy-Item "artifacts/HKey-windows-x64/HKey.exe" -Destination "dist/HKey.exe" -Force
          }
          $sums = Get-ChildItem dist -File | Sort-Object Name | ForEach-Object {
            $h = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$h  $($_.Name)"
          }
          [IO.File]::WriteAllLines("$PWD/dist/SHA256SUMS.txt", $sums, (New-Object Text.UTF8Encoding($false)))
          Get-ChildItem dist | Out-Host
      - name: Create or update GitHub Release
        if: steps.rel.outputs.publish == 'true'
        shell: pwsh
        run: |
          $tag = "${{ steps.rel.outputs.tag }}"
          $ver = "${{ steps.rel.outputs.ver }}"
          [string[]]$files = @(Get-ChildItem dist -File | Select-Object -ExpandProperty FullName)
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view "$tag" -R "${{ github.repository }}" 2>$null | Out-Null
          $exists = ($LASTEXITCODE -eq 0)
          $global:LASTEXITCODE = 0
          $ErrorActionPreference = 'Stop'
          if ($exists) {
            gh release upload "$tag" @files --clobber -R "${{ github.repository }}"
          } else {
            gh release create "$tag" @files --target "${{ github.sha }}" --title "HKey $ver" --generate-notes -R "${{ github.repository }}"
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub release failed with exit code $LASTEXITCODE" }
        env:
          GH_TOKEN: ${{ github.token }}
